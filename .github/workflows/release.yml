name: Release

# A release is published for a version exactly once:
#   - when a `v*` tag is pushed,
#   - when the workflow is run manually with a version, or
#   - when the default branch is pushed and the workspace version in
#     Cargo.toml has no release yet (bump the version to cut a release).
on:
  push:
    tags: ["v*"]
    branches: ["**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to create and release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Decide whether to release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          release=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$INPUT_VERSION"; release=true
          elif [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"; release=true
          else
            version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
            tag="v$version"
            if [ "$REF_NAME" = "$DEFAULT_BRANCH" ] && [ -n "$version" ] && ! gh release view "$tag" >/dev/null 2>&1; then
              release=true
            fi
          fi
          case "$tag" in v[0-9]*) ;; *) echo "invalid tag '$tag'"; exit 1 ;; esac
          echo "tag=$tag release=$release"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p hyperspace-host -p hyperspace-client
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target\release\hyperspace-host.exe, README.md dist\
          Compress-Archive -Path dist\* -DestinationPath "hyperspace-host-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: hyperspace-host-*.zip

  macos:
    name: macOS universal
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: cargo build --release -p hyperspace-client --target aarch64-apple-darwin
      - run: cargo build --release -p hyperspace-client --target x86_64-apple-darwin
      - name: Package
        run: |
          mkdir dist
          lipo -create -output dist/hyperspace-client \
            target/aarch64-apple-darwin/release/hyperspace-client \
            target/x86_64-apple-darwin/release/hyperspace-client
          codesign --force --sign - dist/hyperspace-client
          cp README.md dist/
          tar -czf "hyperspace-client-macos-universal.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: hyperspace-client-*.tar.gz

  publish:
    name: Publish GitHub release
    needs: [plan, windows, macos]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: assets
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la assets
          cat > notes.md <<NOTES
          ## Install

          **Windows host** (the machine you want to control): unzip \`hyperspace-host-windows-x64.zip\` and run \`hyperspace-host.exe\`. Allow it through the firewall when Windows asks. It prints a pairing command.

          **macOS client** (the machine you sit at):

          \`\`\`bash
          curl -L https://github.com/${{ github.repository }}/releases/download/$TAG/hyperspace-client-macos-universal.tar.gz | tar -xz
          \`\`\`

          Paste the pairing command the host printed (once), then connect from anywhere with \`./hyperspace-client\`.

          Host and client must be the same version. See the README for options, shortcuts and limitations.
          NOTES
          sed -i 's/^          //' notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --target "$GITHUB_SHA" --title "hyperspace $TAG" --notes-file notes.md
          fi
