name: Release

# A release is published for a version exactly once:
#   - when a `v*` tag is pushed,
#   - when the workflow is run manually with `publish` ticked, or
#   - when the default branch is pushed and the workspace version in
#     Cargo.toml has no release yet (bump the version to cut a release).
# The tag of a release must be `v` followed by the workspace version.
#
# The files of a release that exists are never replaced unless asked: a tag
# push, or a manual run with `publish` ticked, for a release that exists
# fails without touching it. To replace its files, run the workflow manually
# with both `publish` and `replace_assets` ticked. A version counts as
# unpublished only when GitHub answers "not found" for its tag; any other
# answer stops the run.
#
# Run manually without `publish` (the default), the workflow is a dry run:
# it builds and packages everything, then uploads the files it would
# publish as the `release-dry-run` workflow artifact, and publishes nothing.
# Any other push only runs the plan job.
#
# The release page's text is releases/<version>.md without its title line,
# then an install section. The plan job builds it and checks it on every run,
# and a release whose notes file is missing fails there, before any build.
on:
  push:
    tags: ["v*"]
    branches: ["**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag, e.g. v0.1.0 (empty: v + the version in Cargo.toml)"
        required: false
        default: ""
      publish:
        description: "Publish the GitHub release (unticked: dry run, nothing is published)"
        type: boolean
        required: false
        default: false
      replace_assets:
        description: "With publish: replace the files of a release that already exists (unticked: such a run fails)"
        type: boolean
        required: false
        default: false

# Read-only everywhere; only the publish job may write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Decide whether to build and release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
      build: ${{ steps.plan.outputs.build }}
      replace: ${{ steps.plan.outputs.replace }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_REPLACE: ${{ inputs.replace_assets }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          release=false
          build=false
          replace=false
          # Whether to ask GitHub if the tag has a release.
          lookup=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="${INPUT_VERSION:-v$version}"
            build=true
            if [ "$INPUT_PUBLISH" = "true" ]; then release=true; fi
            if [ "$INPUT_REPLACE" = "true" ]; then
              if [ "$release" = "true" ]; then
                replace=true
              else
                echo "::notice::replace_assets applies only with publish: this dry run replaces nothing"
              fi
            fi
          elif [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"; release=true
          else
            tag="v$version"
            if [ "$REF_NAME" = "$DEFAULT_BRANCH" ] && [ -n "$version" ]; then lookup=true; fi
          fi
          if ! [[ "$tag" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "::error::invalid tag '$tag'"; exit 1
          fi
          if [ "$release" = "true" ]; then lookup=true; fi
          published=
          if [ "$lookup" = "true" ]; then
            # Only "not found" means the tag has no release: a failed lookup
            # must never pass for an unpublished version.
            status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$tag") || true
            case "$status" in
              200) published=true ;;
              404) published=false; release=true ;;
              *) echo "::error::cannot tell whether $tag has a release: GitHub answered HTTP $status (expected 200 or 404)"; exit 1 ;;
            esac
          fi
          if [ "$release" = "true" ]; then build=true; fi
          echo "tag=$tag release=$release build=$build replace_assets=$replace"
          if [ "$build" = "true" ]; then
            if [ -z "$version" ] || [ "$tag" != "v$version" ]; then
              if [ "$release" = "true" ]; then
                echo "::error::the tag '$tag' is not v + the workspace version in Cargo.toml ('$version')"
                exit 1
              fi
              echo "::warning::the tag '$tag' is not v + the workspace version in Cargo.toml ('$version'): publishing it would fail"
            fi
          fi
          if [ "$release" = "true" ] && [ "$published" = "true" ] && [ "$replace" != "true" ]; then
            echo "::error::the release $tag already exists and its files are kept: to replace them, run this workflow manually with publish and replace_assets ticked"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "replace=$replace" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The release page's text: releases/<version>.md without its title (the
      # page has its own), then the install section. Built and checked on
      # every push, so a broken notes file shows long before a release; a
      # release without its notes file stops here, before anything is built.
      # The notes file's text only ever goes through tail and cat, never
      # through the shell, so its backticks, $, quotes and % stay as written.
      - name: Release notes
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          RELEASE: ${{ steps.plan.outputs.release }}
        run: |
          src="releases/$VERSION.md"
          : > body.md
          if [ -f "$src" ]; then
            # A byte order mark hides the title from the check below, and the
            # page would then show it.
            if [ "$(head -c 3 "$src" | od -An -tx1 | tr -d ' \n')" = "efbbbf" ]; then
              echo "::error::$src starts with a UTF-8 byte order mark: save it as UTF-8 without one"
              exit 1
            fi
            # Drop the title line, which must read exactly "# hyperspace
            # $VERSION" (line endings aside), and the blank line after it.
            start=1
            if [ "$(head -n 1 "$src" | tr -d '\r')" = "# hyperspace $VERSION" ]; then
              start=2
              if sed -n '2p' "$src" | grep -q '^[[:space:]]*$'; then start=3; fi
            fi
            tail -n "+$start" "$src" > body.md
            first=$(grep -m 1 -v '^[[:space:]]*$' body.md || true)
            if [ -z "$first" ]; then
              echo "::error::$src has nothing under its title: the release page would show only the install section"
              exit 1
            fi
            if [[ "$first" == \#* ]]; then
              if [ "$start" -gt 1 ]; then
                line=$(( start - 1 + $(grep -n -m 1 -v '^[[:space:]]*$' body.md | cut -d: -f1) ))
                echo "::error::$src: the notes under its title start with a heading (line $line), so the release page would open with a section title: put the notes' own text first, before any '##' section"
              else
                echo "::error::$src does not start with its title: its first line must be '# hyperspace $VERSION', then a blank line, then the notes"
              fi
              exit 1
            fi
          elif [ "$RELEASE" = "true" ]; then
            echo "::error::$src is missing: write the release notes of $VERSION before releasing it"
            exit 1
          else
            echo "::warning::$src is missing: releasing $VERSION would fail until it exists"
          fi
          : > notes.md
          if [ -s body.md ]; then
            cat body.md >> notes.md
            # A file without a final newline still ends its last line.
            if [ -n "$(tail -c 1 body.md)" ]; then printf '\n' >> notes.md; fi
            printf '\n' >> notes.md
          fi
          cat >> notes.md <<NOTES
          ## Install

          **Windows host** (the machine you want to control): unzip \`hyperspace-host-windows-x64.zip\` and run \`hyperspace-host.exe\`. Allow it through the firewall when Windows asks. It prints a pairing command.

          **macOS client** (the machine you sit at):

          \`\`\`bash
          curl -L https://github.com/${{ github.repository }}/releases/download/$TAG/hyperspace-client-macos-universal.tar.gz | tar -xz
          \`\`\`

          Paste the pairing command the host printed (once), then connect from anywhere with \`./hyperspace-client\`.

          **Relay** (optional, only for networks that block UDP): \`hyperspace-relay-linux-x64.tar.gz\` is a static Linux x64 binary to run behind a TLS reverse proxy.

          Host and client must be the same version. See the README for options, shortcuts and limitations. \`SHA256SUMS.txt\` lists the checksum of every file.
          NOTES
          echo "----- release page text for $TAG (from $src) -----"
          cat notes.md
          echo "----- end of the release page text -----"
      - name: Hand the release notes to the assemble job
        if: steps.plan.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p hyperspace-host
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target\release\hyperspace-host.exe, README.md dist\
          Compress-Archive -Path dist\* -DestinationPath "hyperspace-host-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: hyperspace-host-*.zip

  macos:
    name: macOS universal
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: cargo build --release -p hyperspace-client --target aarch64-apple-darwin
      - run: cargo build --release -p hyperspace-client --target x86_64-apple-darwin
      - name: Package
        run: |
          mkdir dist
          lipo -create -output dist/hyperspace-client \
            target/aarch64-apple-darwin/release/hyperspace-client \
            target/x86_64-apple-darwin/release/hyperspace-client
          lipo -info dist/hyperspace-client
          if ! lipo dist/hyperspace-client -verify_arch x86_64 arm64; then
            echo "::error::the macOS client is missing its x86_64 or arm64 part"; exit 1
          fi
          codesign --force --sign - dist/hyperspace-client
          codesign --verify --verbose dist/hyperspace-client
          cp README.md dist/
          tar -czf "hyperspace-client-macos-universal.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: hyperspace-client-*.tar.gz

  linux:
    name: Relay (Linux x64, static)
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - name: Build a static musl binary
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --profile relay -p hyperspace-relay --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/relay/hyperspace-relay
          file target/x86_64-unknown-linux-musl/relay/hyperspace-relay | grep -Eq 'statically linked|static-pie linked'
      - name: Package
        run: |
          mkdir dist
          cp target/x86_64-unknown-linux-musl/relay/hyperspace-relay README.md dist/
          tar -czf "hyperspace-relay-linux-x64.tar.gz" -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: hyperspace-relay-*.tar.gz

  assemble:
    name: Assemble the release files (kept as an artifact on a dry run)
    needs: [plan, windows, macos, linux]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      # Each by name: the release notes are an artifact of this run too, and
      # not a file of the release.
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: assets
      - name: Checksums
        run: |
          (cd assets && sha256sum *) > SHA256SUMS.txt
          mv SHA256SUMS.txt assets/
          cat assets/SHA256SUMS.txt
      # Written and checked by the plan job.
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .
      - name: Release notes
        run: |
          ls -la assets
          cat notes.md
      # A dry run keeps what would be published as `release-dry-run`; a
      # release hands the same files to the publish job as `release-files`.
      - name: Keep the dry run, or hand the files to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.plan.outputs.release == 'true' && 'release-files' || 'release-dry-run' }}
          path: |
            assets
            notes.md
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: [plan, assemble]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    # The only job that creates, uploads to or edits a GitHub release.
    permissions:
      contents: write
    # Two runs for one tag (a tag push and a default-branch push of the same
    # version) publish one after the other, never at once: the second finds
    # the release and fails without touching it.
    concurrency:
      group: release-publish-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      REPLACE: ${{ needs.plan.outputs.replace }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release
      - name: Publish the release
        run: |
          ls -la release release/assets
          status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$TAG") || true
          case "$status" in
            404)
              gh release create "$TAG" release/assets/* --target "$GITHUB_SHA" --title "hyperspace $TAG" --notes-file release/notes.md
              ;;
            200)
              if [ "$REPLACE" != "true" ]; then
                echo "::error::the release $TAG already exists (another run may have just published it) and its files are kept: to replace them, run this workflow manually with publish and replace_assets ticked"
                exit 1
              fi
              # Replaces the release's files that have the same name and adds
              # the others. The page's text, title and tag stay as they are:
              # notes changed since are put on the page by hand
              # (gh release edit "$TAG" --notes-file release/notes.md).
              gh release upload "$TAG" release/assets/* --clobber
              echo "::notice::the files of $TAG were replaced; its release page text was left as it was"
              ;;
            *)
              echo "::error::cannot tell whether $TAG has a release: GitHub answered HTTP $status (expected 200 or 404); nothing was published"
              exit 1
              ;;
          esac
