name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Tests + transport e2e (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cargo-lock
          path: Cargo.lock
          retention-days: 1
      - run: cargo build --release --workspace
      - run: bash scripts/e2e.sh target/release
      - name: Relay as a static musl binary
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release -p hyperspace-relay --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/hyperspace-relay
          file target/x86_64-unknown-linux-musl/release/hyperspace-relay | grep -Eq 'statically linked|static-pie linked'
      - name: Relay smoke test
        run: |
          RELAY=target/x86_64-unknown-linux-musl/release/hyperspace-relay
          $RELAY --version
          if $RELAY > relay.log 2>&1; then echo "started without --allow or --open"; exit 1; fi
          $RELAY --open --listen 127.0.0.1:47800 > relay.log 2>&1 &
          PID=$!
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:47800/health
          curl -fsS http://127.0.0.1:47800/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:47800/nope)" = 404
          kill $PID
          echo "--- relay log"; cat relay.log
      - name: Collect the Linux binaries
        run: |
          mkdir -p dist
          cp target/release/hyperspace-host target/release/hyperspace-client dist/
          cp target/x86_64-unknown-linux-musl/release/hyperspace-relay dist/
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/
          retention-days: 7
      - name: Find the host through the public lookup network (live internet)
        # Depends on the public BitTorrent DHT being reachable from the runner.
        continue-on-error: true
        run: |
          D=$(mktemp -d)
          target/release/hyperspace-host --file testdata/testsrc_720p.h264 --once --port 45990 --no-upnp --config-dir $D/host > host.log 2>&1 &
          for i in $(seq 90); do grep -q "address published" host.log && break; sleep 1; done
          cat host.log
          grep -q "address published" host.log
          # The client knows only the key - no address at all.
          KEY=$(cut -d. -f2 $D/host/pairing.txt)
          target/release/hyperspace-client pair "hs1.$KEY." --config-dir $D/client
          target/release/hyperspace-client --headless --frames 60 --connect-timeout 60 --config-dir $D/client
          echo "--- remembered for next time:"; cut -d. -f3- $D/client/host.txt

  windows:
    name: Host (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - name: List displays and encoders
        run: target\release\hyperspace-host.exe --list
      - name: Capture + encode self-test
        run: target\release\hyperspace-host.exe --self-test 30 --dump selftest.bin
      - name: Desktop streaming over loopback
        shell: bash
        run: |
          target/release/hyperspace-host.exe --once --port 45811 --dump desktop.bin --no-dht --config-dir hostcfg > host.log 2>&1 &
          for i in $(seq 100); do [ -s hostcfg/pairing.txt ] && break; sleep 0.2; done
          target/release/hyperspace-client.exe pair "$(cat hostcfg/pairing.txt)" --config-dir clientcfg
          status=0
          target/release/hyperspace-client.exe 127.0.0.1:45811 --config-dir clientcfg --headless --frames 30 --test-input --test-keyframes --stats || status=$?
          sleep 2
          echo "--- host log"; cat host.log
          exit $status
      - name: Find the host through the public lookup network (live internet)
        # Depends on the public BitTorrent DHT being reachable from the runner.
        continue-on-error: true
        shell: bash
        run: |
          target/release/hyperspace-host.exe --file testdata/testsrc_720p.h264 --once --port 45990 --no-upnp --config-dir lookup-host > lookup-host.log 2>&1 &
          for i in $(seq 90); do grep -q "address published" lookup-host.log && break; sleep 1; done
          cat lookup-host.log
          grep -q "address published" lookup-host.log
          KEY=$(cut -d. -f2 lookup-host/pairing.txt)
          target/release/hyperspace-client.exe pair "hs1.$KEY." --config-dir lookup-client
          target/release/hyperspace-client.exe --headless --frames 60 --connect-timeout 60 --config-dir lookup-client
          echo "--- remembered for next time:"; cut -d. -f3- lookup-client/host.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-capture-dumps
          path: |
            selftest.bin
            desktop.bin
          if-no-files-found: ignore

  macos:
    name: Client (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - name: Window + VideoToolbox + Metal over loopback
        run: |
          for codec in h264 h265; do
            target/release/hyperspace-host --file testdata/testsrc_720p.$codec --once --port 45812 --no-upnp --no-dht --config-dir hostcfg > host-$codec.log 2>&1 &
            for i in $(seq 50); do [ -s hostcfg/pairing.txt ] && break; sleep 0.2; done
            target/release/hyperspace-client pair "$(cat hostcfg/pairing.txt)" --config-dir clientcfg
            (sleep 3; screencapture -x shot-$codec.png || true) &
            status=0
            target/release/hyperspace-client 127.0.0.1:45812 --config-dir clientcfg --frames 360 --stats > client-$codec.log 2>&1 || status=$?
            cat client-$codec.log
            echo "--- host log"; cat host-$codec.log
            grep -q "CLIENT OK" client-$codec.log || status=1
            wait
            if [ $status -ne 0 ]; then exit $status; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-client-screenshots
          path: shot-*.png
          if-no-files-found: ignore
