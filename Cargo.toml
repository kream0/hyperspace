[workspace]
resolver = "2"
members = ["crates/proto", "crates/host", "crates/client", "crates/relay", "crates/bridge"]

[workspace.package]
version = "0.3.1"
edition = "2021"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

# The relay is a long-running server: a panic must end one connection (its
# drop guards give the seat back), not the whole process.
[profile.relay]
inherits = "release"
panic = "unwind"
