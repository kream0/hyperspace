[package]
name = "hyperspace-client"
version.workspace = true
edition.workspace = true
description = "hyperspace client: displays the remote desktop and forwards input"

[[bin]]
name = "hyperspace-client"
path = "src/main.rs"

[dependencies]
hyperspace-proto = { path = "../proto" }
socket2 = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
raw-window-metal = "1"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-video-toolbox = "0.3"
objc2-metal = "0.3"
objc2-quartz-core = "0.3"
