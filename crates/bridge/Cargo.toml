[package]
name = "hyperspace-bridge"
version.workspace = true
edition.workspace = true
description = "Carries a host's or a client's UDP datagrams through a hyperspace relay"

[dependencies]
hyperspace-proto = { path = "../proto" }
# A single-threaded runtime on a thread of its own: the streaming threads
# never wait on the network for it.
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
# TLS through the operating system (SChannel, Security.framework, OpenSSL) and
# its certificate store: what a company proxy that inspects TLS expects.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake", "native-tls"] }
tokio-native-tls = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
socket2 = "0.6"
getrandom = "0.3"

[dev-dependencies]
hyperspace-relay = { path = "../relay" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros"] }
