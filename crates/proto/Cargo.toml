[package]
name = "hyperspace-proto"
version.workspace = true
edition.workspace = true

[dependencies]
memchr = "2"
snow = { version = "0.10", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
getrandom = "0.3"
blake2 = "0.10"
chacha20poly1305 = "0.10"
mainline = { version = "8", default-features = false, features = ["node"] }
